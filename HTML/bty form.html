<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Table</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid white;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #333;
        }

        .progress-container {
            width: 100px;
            background-color: #555;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 14px;
            background-color: #4caf50;
        }

        .progress-text {
            position: absolute;
            width: 120px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 9px;
            color: white;
        }
    </style>
</head>

<body>

    <table id="dataTable">
        <thead>
            <tr id="tableHead"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        const dataString = `{
            "Area A": [
                { "name": "Unit A", "type": "srbm", "status": "HIDE", "defaultReloadTime": 45, "reloadTimeForBty": 30, "reloadTimeForAmmoSec": 20, "remainingAmmoInVehicles": 50, "remainingAmmo": 100 },
                { "name": "Unit B", "type": "srbm", "status": "HIDE", "defaultReloadTime": 45, "reloadTimeForBty": 20, "reloadTimeForAmmoSec": 20, "remainingAmmoInVehicles": 50, "remainingAmmo": 100 },
                { "name": "Unit C", "type": "srbm", "status": "HIDE", "defaultReloadTime": 45, "reloadTimeForBty": 20, "reloadTimeForAmmoSec": 20, "remainingAmmoInVehicles": 50, "remainingAmmo": 100 }
            ],
            "Area B": [
                { "name": "Unit A", "type": "srbm", "status": "HIDE", "defaultReloadTime": 45, "reloadTimeForBty": 30, "reloadTimeForAmmoSec": 20, "remainingAmmoInVehicles": 50, "remainingAmmo": 100 },
                { "name": "Unit B", "type": "srbm", "status": "HIDE", "defaultReloadTime": 45, "reloadTimeForBty": 20, "reloadTimeForAmmoSec": 20, "remainingAmmoInVehicles": 50, "remainingAmmo": 100 },
                { "name": "Unit C", "type": "srbm", "status": "HIDE", "defaultReloadTime": 45, "reloadTimeForBty": 20, "reloadTimeForAmmoSec": 20, "remainingAmmoInVehicles": 50, "remainingAmmo": 100 }
            ]
        }`;

        let data = JSON.parse(dataString);
        let tableHead = document.getElementById("tableHead");
        let tableBody = document.getElementById("tableBody");

        let headers = ["Name", "Type", "Status", "Reload Time (Bty)", "Reload Time (Ammo Sec)", "Ammo in Vehicles", "Remaining Ammo"];
        headers.forEach(header => {
            let th = document.createElement("th");
            th.textContent = header;
            tableHead.appendChild(th);
        });

        Object.keys(data).forEach(area => {
            let areaUnits = data[area];
            areaUnits.forEach((unit, index) => {
                let row = document.createElement("tr");

                ["name", "type", "status"].forEach(key => {
                    let cell = document.createElement("td");
                    cell.textContent = key === "type" ? unit[key].toUpperCase() : unit[key];
                    row.appendChild(cell);
                });

                ["reloadTimeForBty", "reloadTimeForAmmoSec"].forEach(key => {
                    let progressCell = document.createElement("td");
                    let progressContainer = document.createElement("div");
                    progressContainer.classList.add("progress-container");

                    let progressBar = document.createElement("div");
                    progressBar.classList.add("progress-bar");
                    let percentage = (unit[key] / unit.defaultReloadTime) * 100;
                    progressBar.style.width = percentage + "%";

                    let progressText = document.createElement("div");
                    progressText.classList.add("progress-text");
                    progressText.textContent = `${unit[key]} / ${unit.defaultReloadTime} mins`;

                    progressContainer.appendChild(progressBar);
                    progressContainer.appendChild(progressText);
                    progressCell.appendChild(progressContainer);
                    row.appendChild(progressCell);
                });

                if (index === 0) {
                    ["remainingAmmoInVehicles", "remainingAmmo"].forEach(key => {
                        let ammoCell = document.createElement("td");
                        ammoCell.textContent = unit[key];
                        ammoCell.rowSpan = areaUnits.length;
                        row.appendChild(ammoCell);
                    });
                }

                tableBody.appendChild(row);
            });
        });
    </script>

</body>

</html>
