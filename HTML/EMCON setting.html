<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate radar of SAM system</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #2d2d2d;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 2rem;
        }

        .checkbox-group {
            margin: 1rem 0;
            display: flex;
            align-items: center;
        }

        input[type="checkbox"] {
            appearance: none;
            width: 20px;
            height: 20px;
            background-color: #404040;
            border: 2px solid #666;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        input[type="checkbox"]:checked {
            background-color: #00cc00;
            position: relative;
        }

        input[type="checkbox"]:checked::after {
            content: '✔';
            position: absolute;
            color: #fff;
            left: 4px;
            top: 0;
        }

        label {
            font-size: 1.1rem;
            cursor: pointer;
        }

        label:hover {
            color: #cccccc;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>EMCON Settings</h2>
        <div class="checkbox-group">
            <input type="checkbox" id="pac23" name="pac23">
            <label for="pac23">Pac-2/3</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="skybow3" name="skybow3">
            <label for="skybow3">Sky Bow-3</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="tc2" name="tc2">
            <label for="tc2">TC-2</label>
        </div>
    </div>
</body>

</html>
